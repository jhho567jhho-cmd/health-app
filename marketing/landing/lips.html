  <style>

      :root:not([data-theme="light"]) { --bg:#1a1216; --ink:#f5eef0; --accent:#e27b96; --muted:#b9a7ad; }

    .note { color: var(--muted); font-size: 13px; margin-top: 26px; line-height: 1.6; }
    .note a { color: var(--accent); }
  </style>
</head>
