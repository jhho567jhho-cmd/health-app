<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אפליקציית בריאות וכושר משותפת</title>
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="בריאות">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            direction: rtl;
        }

        .login-screen {
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .login-box h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .login-box p {
            font-size: 16px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .login-buttons {
            display: flex;
            gap: 15px;
            flex-direction: column;
        }

        .login-btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
        }

        .login-btn.chaim {
            background: white;
            color: #667eea;
        }

        .login-btn.chaim:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .login-btn.devorah {
            background: #ff6b9d;
            color: white;
        }

        .login-btn.devorah:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        .app-container {
            display: none;
            height: 100vh;
            background: white;
            flex-direction: column;
        }

        .app-container.active {
            display: flex;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid #764ba2;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
            flex: 1;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tabs {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            direction: rtl;
            font-family: inherit;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .note-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #667eea;
        }

        .delete-btn {
            background: #ff6b6b !important;
            padding: 8px 12px !important;
            font-size: 12px !important;
            width: auto !important;
            margin-top: 8px !important;
            display: inline-block !important;
        }

        .delete-btn:hover {
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4) !important;
        }

        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #4caf50;
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #c62828;
        }

        .online-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: 5px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
        }
        .content { padding-bottom: 90px; }

        .back-btn { width: auto; background: none; color: #667eea; padding: 6px 0; margin-bottom: 10px; font-size: 14px; box-shadow: none !important; transform: none !important; }

        .more-list { display: grid; gap: 10px; }

        .home-hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .hero-greet { font-size: 20px; font-weight: 700; }
        .hero-date { font-size: 13px; opacity: 0.9; margin-top: 2px; }
        .hero-tasks { font-size: 13px; margin-top: 8px; }
        .ring { width: 74px; height: 74px; border-radius: 50%; background: conic-gradient(#fff var(--p, 0deg), rgba(255, 255, 255, 0.25) 0); display: grid; place-items: center; flex-shrink: 0; }
        .ring span { width: 58px; height: 58px; border-radius: 50%; background: #667eea; display: grid; place-items: center; font-weight: 700; font-size: 15px; }

        .home-card { background: white; border: 1px solid #e7e9f2; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .home-card h3 { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .home-card h3 small { color: #8a90a2; font-weight: 400; font-size: 12px; }

        .glasses { display: flex; gap: 6px; flex-wrap: wrap; }
        .glass { width: 34px; height: 40px; padding: 0; border: 2px solid #3aa0e8; border-radius: 4px 4px 10px 10px; background: white; box-shadow: none !important; transform: none !important; }
        .glass.on { background: linear-gradient(to top, #3aa0e8 80%, white 80%); }

        .home-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f0f1f6; font-size: 14px; }
        .home-row:first-child { border-top: 0; }
        .home-row.done span { text-decoration: line-through; color: #8a90a2; }
        .check { width: 26px; height: 26px; min-width: 26px; padding: 0; border-radius: 8px; border: 2px solid #d5d9e6; background: white; color: white; font-size: 14px; box-shadow: none !important; transform: none !important; }
        .check.on { background: #2e9e6a; border-color: #2e9e6a; }

        .home-add { display: flex; gap: 8px; margin-top: 10px; }
        .home-add input { flex: 1; }
        .home-add button { width: auto; white-space: nowrap; }
        .home-action { margin-top: 10px; background: #f0f2fb; color: #667eea; box-shadow: none !important; transform: none !important; }

        .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 4px; }
        .stats3 div { background: #f5f6fb; border-radius: 12px; padding: 10px 4px; }
        .stats3 b { display: block; font-size: 18px; }
        .stats3 small { color: #8a90a2; font-size: 11px; }

        .bar { height: 10px; background: #eceef6; border-radius: 6px; overflow: hidden; }
        .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.4s; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e7e9f2; justify-content: space-around; padding: 8px 0 12px; z-index: 10; }
        .app-container.active + .bottom-nav { display: flex; }
        .nav-btn { width: auto; background: none; color: #8a90a2; font-size: 12px; padding: 4px 10px; display: grid; justify-items: center; gap: 2px; box-shadow: none !important; transform: none !important; }
        .nav-btn b { font-size: 20px; }
        .nav-btn.active { color: #667eea; font-weight: 700; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>💪 בריאות וכושר</h1>
            <p>אפליקציה משותפת עבור חיים ודבורה</p>
            <div class="login-buttons">
                <button class="login-btn chaim" onclick="login('chaim')">👨 כניסה כחיים</button>
                <button class="login-btn devorah" onclick="login('devorah')">👩 כניסה כדבורה</button>
            </div>
        </div>
    </div>

    <!-- App -->
    <div id="appContainer" class="app-container">
        <div class="header">
            <h1>💪 בריאות וכושר</h1>
            <div class="user-info">
                <span id="currentUser"></span>
                <span class="online-status"></span>
                <button class="logout-btn" onclick="logout()">התנתק</button>
            </div>
        </div>

        <div class="content">
            <!-- Home Tab -->
            <div id="home" class="tab-content active">
                <div class="home-hero">
                    <div>
                        <div class="hero-greet" id="homeGreet"></div>
                        <div class="hero-date" id="homeDate"></div>
                        <div class="hero-tasks"><span id="homeTasksDone">0</span> מתוך <span id="homeTasksTotal">0</span> משימות הושלמו</div>
                    </div>
                    <div class="ring" id="homeRing"><span id="homeRingPct">0%</span></div>
                </div>

                <div class="home-card">
                    <h3>💧 מים <small id="homeWaterTxt"></small></h3>
                    <div class="glasses" id="homeWater"></div>
                </div>

                <div class="home-card">
                    <h3>✅ להיום</h3>
                    <div id="homeTasks"></div>
                    <div class="home-add">
                        <input type="text" id="homeTask" placeholder="הוסף משימה...">
                        <button onclick="addHomeTask()">+ הוסף</button>
                    </div>
                </div>

                <div class="home-card">
                    <h3>⚖️ משקל <small id="homeWeightTxt"></small></h3>
                    <div class="stats3">
                        <div><b id="homeWeightLast">—</b><small>אחרון</small></div>
                        <div><b id="homeWeightAvg">—</b><small>ממוצע</small></div>
                        <div><b id="homeWeightChange">—</b><small>שבוע</small></div>
                    </div>
                    <div class="home-add">
                        <input type="number" id="homeWeight" step="0.1" min="0" placeholder='ק"ג'>
                        <button onclick="addHomeWeight()">💾 שמור</button>
                    </div>
                </div>

                <div class="home-card">
                    <h3>🍽️ קלוריות היום <small id="homeCalTxt"></small></h3>
                    <div class="bar"><span id="homeCalBar"></span></div>
                    <button class="home-action" onclick="showSection('menu', 'menu')">+ הוסף ארוחה</button>
                </div>

                <div class="home-card">
                    <h3>📸 תמונות <small id="homePhotoTxt"></small></h3>
                    <button class="home-action" onclick="showSection('photos', 'photos')">📷 הוסף תמונה</button>
                </div>
            </div>

            <!-- More Tab -->
            <div id="more" class="tab-content">
                <h2 style="text-align: center; color: #667eea; margin-bottom: 15px;">☰ עוד</h2>
                <div class="more-list">
                    <button onclick="showSection('ai', 'more')">🤖 עוזר בריאות</button>
                    <button onclick="showSection('weight', 'more')">⚖️ היסטוריית משקל</button>
                    <button onclick="showSection('tasks', 'more')">✅ כל המשימות</button>
                    <button onclick="showSection('tips', 'more')">💡 טיפים</button>
                    <button onclick="logout()">🚪 התנתק</button>
                </div>
            </div>

            <!-- AI Assistant Tab -->
            <div id="ai" class="tab-content">
                <button class="back-btn" onclick="showSection('more', 'more')">→ חזרה לעוד</button>
                <h2 style="text-align: center; color: #667eea; margin-bottom: 15px;">🤖 עוזר בריאות</h2>
                <div style="background: #f0f7ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-right: 3px solid #667eea;">
                    <p style="color: #333; line-height: 1.5; font-size: 13px;">👋 שלום! בחר נושא או שאל שאלה:</p>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px;">
                    <button onclick="openAI('בריאות')">💪 בריאות</button>
                    <button onclick="openAI('משקל')">⚖️ משקל</button>
                    <button onclick="openAI('מתכונים')">🍽️ מתכונים</button>
                    <button onclick="openAI('תרגילים')">🏃 תרגילים</button>
                </div>
                <label>או שאל שאלה משלך:</label>
                <input type="text" id="aiQuestion" placeholder="שאל אותי משהו...">
                <button onclick="openAI(document.getElementById('aiQuestion').value)" style="margin-top: 10px;">🚀 שלח</button>
                <div id="aiResponse"></div>
            </div>

            <!-- Photos Tab -->
            <div id="photos" class="tab-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <button onclick="triggerCameraInput()">📷 צלם תמונה</button>
                    <button onclick="triggerPhotoInput()">📁 בחר תמונה</button>
                </div>
                <div class="input-group">
                    <label>הערה על התמונה:</label>
                    <input type="text" id="photoNote" placeholder="רשום הערה...">
                </div>
                <button onclick="addPhoto()">💾 שמור תמונה</button>
                <div id="photosList"></div>
            </div>

            <!-- Menu Tab -->
            <div id="menu" class="tab-content">
                <div class="input-group">
                    <label>שם המנה:</label>
                    <input type="text" id="menuName" placeholder="לדוגמה: עוף צלוי">
                </div>
                <div class="input-group">
                    <label>קלוריות:</label>
                    <input type="number" id="menuCal" placeholder="0" min="0">
                </div>
                <div class="input-group">
                    <label>קטגוריה:</label>
                    <select id="menuCat">
                        <option value="">בחר קטגוריה</option>
                        <option value="בשר">🥩 בשר</option>
                        <option value="דגים">🐟 דגים</option>
                        <option value="ירקות">🥬 ירקות</option>
                        <option value="פרות">🍎 פרות</option>
                        <option value="קרבוהידרטים">🍞 קרבוהידרטים</option>
                        <option value="אחר">🔄 אחר</option>
                    </select>
                </div>
                <button onclick="addMenuItem()">🍽️ הוסף לתפריט</button>
                <div id="menuList"></div>
            </div>

            <!-- Tips Tab -->
            <div id="tips" class="tab-content">
                <button class="back-btn" onclick="showSection('more', 'more')">→ חזרה לעוד</button>
                <button onclick="generateTip()" style="margin-bottom: 15px;">💡 קבל טיפ חדש</button>
                <div id="tipsList"></div>
            </div>

            <!-- Weight Tab -->
            <div id="weight" class="tab-content">
                <button class="back-btn" onclick="showSection('more', 'more')">→ חזרה לעוד</button>
                <div class="input-group">
                    <label>משקל (ק"ג):</label>
                    <input type="number" id="weightValue" placeholder="0.0" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label>תאריך ושעה:</label>
                    <input type="datetime-local" id="weightDate">
                </div>
                <button onclick="addWeight()">⚖️ שמור משקל</button>
                <div id="weightList"></div>
            </div>

            <!-- Tasks Tab -->
            <div id="tasks" class="tab-content">
                <button class="back-btn" onclick="showSection('more', 'more')">→ חזרה לעוד</button>
                <div class="input-group">
                    <label>משימה חדשה:</label>
                    <input type="text" id="taskName" placeholder="לדוגמה: הולכה 30 דקות">
                </div>
                <button onclick="addTask()" style="margin-bottom: 15px;">✅ הוסף משימה</button>
                <div id="tasksList"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="home" onclick="showSection('home', 'home')"><b>🏠</b>בית</button>
        <button class="nav-btn" data-nav="menu" onclick="showSection('menu', 'menu')"><b>🍽️</b>תפריט</button>
        <button class="nav-btn" data-nav="photos" onclick="showSection('photos', 'photos')"><b>📸</b>תמונות</button>
        <button class="nav-btn" data-nav="more" onclick="showSection('more', 'more')"><b>☰</b>עוד</button>
    </nav>

    <script>
        let currentUser = null;
        const DATA_KEY = 'health-app-data-v6';
        const TIPS = [
            '🚶 הליכה 30 דקות ביום היא טובה כמו סופרגיבור!',
            '💧 שתה 8 כוסות מים ביום להישאר מחוברת.',
            '🥗 אכול יותר ירקות בכל ארוחה.',
            '😴 שינה 7-8 שעות בלילה חיוני לבריאות.',
            '🏃 אימון 30 דקות ביום משפר את הבריאות.',
            '🧘 מדיטציה 10 דקות ביום מורידה את הלחץ.',
            '🍎 תפוח ביום מעבר לרופא!',
            '🙏 חיוך הוא התרופה הטובה ביותר.'
        ];

        const AI_RESPONSES = {
            'משקל': '⚖️ הורדת משקל בריאה\n\n✓ שתה 8 כוסות מים ביום\n✓ אכול ארוחות קטנות 5-6 פעמים\n✓ תאמן 30 דקות, 5 ימים בשבוע\n✓ נם 7-8 שעות בלילה\n✓ צמצם סוכר\n\n🎯 יעד: 0.5-1 ק״ג בשבוע',
            'בריאות': '💪 תכנית בריאות\n\n1. פעילות: הליכה 30 דקות ביום\n2. תזונה: ירקות, פרות, חלבון\n3. שינה: 7-8 שעות בלילה\n4. מים: 8 כוסות ביום\n5. עקוב אחרי ההתקדמות!',
            'מתכונים': '🍽️ מתכונים בריאים\n\n• סלט ירקות עם לימון\n• עוף בתנור עם ירקות\n• דגים צלויים עם אורז חום\n• ביצים עם שום\n• חומוס עם סלט\n• סלט טונה\n\n💡 הכן ארוחות בראשון!',
            'תרגילים': '🏃 תכנית תרגילים\n\nיום א׳: הליכה 30 דקות\nיום ב׳: יוגה 20 דקות\nיום ג׳: כוח 25 דקות\nיום ד׳: בריכה/ריצה\nיום ה׳: כושר\nשישי-שבת: הרפיה'
        };

        // Login
        function login(user) {
            currentUser = user;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            document.getElementById('currentUser').textContent = user === 'chaim' ? '👨 חיים' : '👩 דבורה';
            displayPhotos();
            displayMenu();
            displayTips();
            displayWeight();
            displayTasks();
            initWeightDate();
            showSection('home', 'home');
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('active');
        }

        // Local Data Functions (localStorage)
        function getData() {
            try {
                const data = localStorage.getItem(DATA_KEY);
                return Object.assign(getDefaultData(), data ? JSON.parse(data) : {});
            } catch (e) {
                return getDefaultData();
            }
        }

        function getDefaultData() {
            return { photos: [], menu: [], weights: [], tasks: [], aiTips: [], water: {} };
        }

        function saveData(data) {
            try {
                localStorage.setItem(DATA_KEY, JSON.stringify(data));
            } catch (e) {
                showError('❌ שגיאה בשמירה');
            }
        }

        const WATER_GOAL = 8;
        const CALORIE_GOAL = 1800;

        function todayKey() {
            return new Date().toLocaleDateString('he-IL');
        }

        function showSection(sectionId, navId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('active', el.dataset.nav === navId));
            document.querySelector('.content').scrollTop = 0;
        }

        function renderHome() {
            const data = getData();
            const today = todayKey();

            const hour = new Date().getHours();
            const greet = hour < 12 ? 'בוקר טוב' : hour < 18 ? 'צהריים טובים' : 'ערב טוב';
            const name = currentUser === 'devorah' ? 'דבורה' : 'חיים';
            document.getElementById('homeGreet').textContent = `${greet}, ${name} 👋`;
            document.getElementById('homeDate').textContent = new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });

            const done = data.tasks.filter(t => t.completed).length;
            const total = data.tasks.length;
            const pct = total ? Math.round(done / total * 100) : 0;
            document.getElementById('homeTasksDone').textContent = done;
            document.getElementById('homeTasksTotal').textContent = total;
            document.getElementById('homeRingPct').textContent = pct + '%';
            document.getElementById('homeRing').style.setProperty('--p', (pct * 3.6) + 'deg');
            document.getElementById('homeTasks').innerHTML = total === 0
                ? '<div class="empty-state">אין משימות עדיין</div>'
                : data.tasks.map((t, i) => `
                    <div class="home-row ${t.completed ? 'done' : ''}">
                        <button class="check ${t.completed ? 'on' : ''}" onclick="toggleTask(${i})">${t.completed ? '✓' : ''}</button>
                        <span>${t.name}</span>
                    </div>
                `).join('');

            const glasses = data.water[today] || 0;
            document.getElementById('homeWaterTxt').textContent = `${glasses} מתוך ${WATER_GOAL} כוסות`;
            document.getElementById('homeWater').innerHTML = Array.from({ length: WATER_GOAL }, (_, i) =>
                `<button class="glass ${i < glasses ? 'on' : ''}" onclick="tapWater(${i})"></button>`
            ).join('');

            const weights = data.weights.map(w => parseFloat(w.val));
            const last = weights.length ? weights[weights.length - 1] : null;
            const avg = weights.length ? (weights.reduce((a, b) => a + b, 0) / weights.length).toFixed(1) : null;
            const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            let change = null;
            for (let i = data.weights.length - 1; i >= 0; i--) {
                if (data.weights[i].ts && data.weights[i].ts <= weekAgo) {
                    change = (last - weights[i]).toFixed(1);
                    break;
                }
            }
            document.getElementById('homeWeightLast').textContent = last === null ? '—' : last;
            document.getElementById('homeWeightAvg').textContent = avg === null ? '—' : avg;
            document.getElementById('homeWeightChange').textContent = change === null ? '—' : (change > 0 ? '+' : '') + change;
            document.getElementById('homeWeightTxt').textContent = weights.length ? `${weights.length} מדידות` : 'עדיין אין מדידות';

            const kcal = data.menu
                .filter(m => m.date && m.date.startsWith(today))
                .reduce((sum, m) => sum + (parseFloat(m.cal) || 0), 0);
            document.getElementById('homeCalTxt').textContent = `${kcal} מתוך ${CALORIE_GOAL}`;
            document.getElementById('homeCalBar').style.width = Math.min(100, kcal / CALORIE_GOAL * 100) + '%';

            document.getElementById('homePhotoTxt').textContent = `${data.photos.length} בגלריה`;
        }

        function tapWater(i) {
            const data = getData();
            const key = todayKey();
            const current = data.water[key] || 0;
            data.water[key] = (i + 1 === current) ? i : i + 1;
            saveData(data);
            renderHome();
        }

            const input = document.getElementById('homeTask');
            const name = input.value.trim();
            if (!name) {
                showError('⚠️ הכנס שם');
                return;

            const data = getData();
            data.tasks.push({ name: name, completed: false, date: new Date().toLocaleString('he-IL') });

        function addHomeWeight() {
            const input = document.getElementById('homeWeight');
            if (!input.value) {
                showError('⚠️ הכנס משקל');
                return;

            const data = getData();

        let selectedPhotoFile = null;

        function triggerCameraInput() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = function(e) {
                if (e.target.files && e.target.files[0]) {

        function triggerPhotoInput() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                if (e.target.files && e.target.files[0]) {
                    selectedPhotoFile = e.target.files[0];
                    showSuccess('✅ תמונה נבחרה!');

        function addPhoto() {
            if (!selectedPhotoFile) {
                showError('⚠️ בחר תמונה');
                return;
            }
            compressImage(selectedPhotoFile, function(compressedImage) {
                const data = getData();
                data.photos.push({
                    image: compressedImage,
                    note: document.getElementById('photoNote').value || 'ללא הערה',
                    date: new Date().toLocaleString('he-IL')
                });
                saveData(data);
                document.getElementById('photoNote').value = '';
                selectedPhotoFile = null;
                displayPhotos();
                showSuccess('✅ תמונה נשמרה!');
            });
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxWidth = 500;
                    const maxHeight = 500;
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedData = canvas.toDataURL('image/jpeg', 0.3);
                    callback(compressedData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function generateTip() {
            const data = getData();

            data.aiTips.push({

        function addWeight() {
            const value = document.getElementById('weightValue').value;
            if (!value) {
                showError('⚠️ הכנס משקל');
                return;
            }
            const data = getData();
            const dateObj = document.getElementById('weightDate').value ? new Date(document.getElementById('weightDate').value) : new Date();
            data.weights.push({
                val: parseFloat(value),
                time: dateObj.toLocaleString('he-IL'),
                ts: dateObj.getTime()
            });
            saveData(data);
            document.getElementById('weightValue').value = '';
            displayWeight();
            showSuccess('✅ שמור!');

        function displayWeight() {
            renderHome();
            const data = getData();
            const list = document.getElementById('weightList');
            if (data.weights.length === 0) {
                list.innerHTML = '<div class="empty-state">אין נתונים</div>';
                return;
            }
            const weights = data.weights.map(w => parseFloat(w.val));
            const latest = weights[weights.length - 1];
            const avg = (weights.reduce((a, b) => a + b) / weights.length).toFixed(1);
            list.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; text-align: center;">

                    </div>
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 20px; font-weight: bold;">${avg}</div>

                ${data.weights.map((w, i) => `

                        <button class="delete-btn" onclick="deleteWeight(${i});">🗑️ מחק</button>
                    </div>
                `).reverse().join('')}
            `;
        }

            data.weights.splice(index, 1);
            saveData(data);
            displayWeight();

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            if (!name) {
                showError('⚠️ הכנס שם');
                return;
            }
            const data = getData();
            data.tasks.push({
                name: name,
                completed: false,
                date: new Date().toLocaleString('he-IL')
            });
            saveData(data);
            document.getElementById('taskName').value = '';
            displayTasks();
            showSuccess('✅ נוסף!');

        function displayTasks() {
            renderHome();
            const data = getData();
            const list = document.getElementById('tasksList');
            if (data.tasks.length === 0) {
                list.innerHTML = '<div class="empty-state">אין משימות</div>';
                return;
            }
            list.innerHTML = data.tasks.map((task, i) => `
                <div class="note-item ${task.completed ? 'completed' : ''}" style="${task.completed ? 'opacity: 0.6; text-decoration: line-through;' : ''}">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
                        <span style="font-weight: bold;">${task.name}</span>

        function toggleTask(index) {
            const data = getData();
            data.tasks[index].completed = !data.tasks[index].completed;
            saveData(data);
            displayTasks();

        function deleteTask(index) {
            const data = getData();
            data.tasks.splice(index, 1);
            saveData(data);
            displayTasks();
        }

        function openAI(question) {
            if (!question || question.trim() === '') {
                showError('⚠️ שאל משהו');
                return;
            }
            const responseDiv = document.getElementById('aiResponse');
            responseDiv.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">⏳ חושב...</div>';
            let response = null;
            const questionLower = question.toLowerCase();
            for (let [keyword, answer] of Object.entries(AI_RESPONSES)) {
                if (questionLower.includes(keyword)) {
                    response = answer;
                    break;
                }
            }
            if (!response) {
                response = '👋 שלום! אני יכול לעזור עם:\n\n• משקל\n• בריאות\n• מתכונים\n• תרגילים\n\nנסה שוב!';
            }
            setTimeout(() => {
                responseDiv.innerHTML = `<div style="background: #e8f5e9; border-right: 3px solid #4caf50; padding: 12px; border-radius: 5px; margin-top: 15px; white-space: pre-wrap; line-height: 1.6; color: #2e7d32; font-size: 13px;">${response}</div>`;
                document.getElementById('aiQuestion').value = '';
            }, 600);
        }

        function showSuccess(msg) {
            const content = document.querySelector('.content');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'success-msg';
            msgDiv.textContent = msg;
            content.insertBefore(msgDiv, content.firstChild);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        function showError(msg) {
            const content = document.querySelector('.content');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'error-msg';
            msgDiv.textContent = msg;
            content.insertBefore(msgDiv, content.firstChild);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        function initWeightDate() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('weightDate').value = now.toISOString().slice(0, 16);
        }
