<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אפליקציית בריאות וכושר</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            direction: rtl;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #764ba2;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 5px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
            color: #333;
            min-width: 50px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            direction: rtl;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #667eea;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .item-title {
            font-weight: 600;
            color: #333;
        }

        .item-date {
            font-size: 12px;
            color: #999;
        }

        .item-detail {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }

        .delete-btn {
            background: #ff6b6b !important;
            padding: 8px 12px !important;
            font-size: 12px !important;
            width: auto !important;
            margin-top: 8px !important;
            display: inline-block !important;
        }

        .delete-btn:hover {
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4) !important;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-left: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .photo-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .photo-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .photo-info {
            padding: 12px;
        }

        .photo-note {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .photo-date {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .ai-button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .ai-quick-btn {
            background: #667eea !important;
            padding: 10px !important;
            font-size: 12px !important;
            border-radius: 5px !important;
        }

        .ai-response-box {
            background: #e8f5e9;
            border-right: 3px solid #4caf50;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #2e7d32;
            font-size: 13px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group button {
            width: 100%;
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #c62828;
        }

        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💪 בריאות וכושר</h1>
            <p>עקוב אחרי הדרך שלך</p>
        </div>

        <div class="tabs" style="margin: 15px;">
            <button class="tab-btn active" onclick="switchTab(event, 'ai')">🤖 עוזר</button>
            <button class="tab-btn" onclick="switchTab(event, 'photos')">📸 תמונות</button>
            <button class="tab-btn" onclick="switchTab(event, 'menu')">🍽️ תפריט</button>
            <button class="tab-btn" onclick="switchTab(event, 'tips')">💡 טיפים</button>
            <button class="tab-btn" onclick="switchTab(event, 'weight')">⚖️ משקל</button>
            <button class="tab-btn" onclick="switchTab(event, 'tasks')">✅ משימות</button>
        </div>

        <div class="content">
            <!-- AI Assistant Tab -->
            <div id="ai" class="tab-content active">
                <h2 style="text-align: center; color: #667eea; margin-bottom: 15px;">🤖 עוזר בריאות</h2>

                <div style="background: #f0f7ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-right: 3px solid #667eea;">
                    <p style="color: #333; line-height: 1.5; font-size: 13px;">
                        👋 שלום! בחר נושא או שאל שאלה:
                    </p>
                </div>

                <div class="ai-button-group">
                    <button class="ai-quick-btn" onclick="openAI('בריאות')">💪 בריאות</button>
                    <button class="ai-quick-btn" onclick="openAI('משקל')">⚖️ משקל</button>
                    <button class="ai-quick-btn" onclick="openAI('מתכונים')">🍽️ מתכונים</button>
                    <button class="ai-quick-btn" onclick="openAI('תרגילים')">🏃 תרגילים</button>
                </div>

                <div style="border-top: 2px solid #ddd; padding-top: 15px;">
                    <label>או שאל שאלה משלך:</label>
                    <input type="text" id="aiQuestion" placeholder="שאל אותי משהו..." style="margin-bottom: 10px;">
                    <button onclick="openAI(document.getElementById('aiQuestion').value)">🚀 שלח</button>
                </div>

                <div id="aiResponse"></div>
            </div>

            <!-- Photos Tab -->
            <div id="photos" class="tab-content">
                <div class="button-group" style="margin-bottom: 15px;">
                    <button onclick="triggerCameraInput()" style="background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);">📷 צלם תמונה</button>
                    <button onclick="triggerPhotoInput()" style="background: linear-gradient(135deg, #2196f3 0%, #0b7dda 100%);">📁 בחר תמונה</button>
                </div>
                <div class="input-group">
                    <label>הערה על התמונה:</label>
                    <input type="text" id="photoNote" placeholder="רשום הערה...">
                </div>
                <button onclick="addPhoto()">💾 שמור תמונה</button>
                <div id="photosList"></div>
            </div>

            <!-- Menu Tab -->
            <div id="menu" class="tab-content">
                <div class="input-group">
                    <label>שם המנה:</label>
                    <input type="text" id="menuName" placeholder="לדוגמה: עוף צלוי">
                </div>
                <div class="input-group">
                    <label>קלוריות:</label>
                    <input type="number" id="menuCal" placeholder="0" min="0">
                </div>
                <div class="input-group">
                    <label>קטגוריה:</label>
                    <select id="menuCat">
                        <option value="">בחר קטגוריה</option>
                        <option value="בשר">🥩 בשר</option>
                        <option value="דגים">🐟 דגים</option>
                        <option value="ירקות">🥬 ירקות</option>
                        <option value="פרות">🍎 פרות</option>
                        <option value="קרבוהידרטים">🍞 קרבוהידרטים</option>
                        <option value="אחר">🔄 אחר</option>
                    </select>
                </div>
                <button onclick="addMenuItem()">🍽️ הוסף לתפריט</button>
                <div id="menuList"></div>
            </div>

            <!-- Tips Tab -->
            <div id="tips" class="tab-content">
                <button onclick="generateTip()" style="margin-bottom: 15px;">💡 קבל טיפ חדש</button>
                <div id="tipsList"></div>
            </div>

            <!-- Weight Tab -->
            <div id="weight" class="tab-content">
                <div class="stats" id="weightStats"></div>
                <div class="input-group">
                    <label>משקל (ק"ג):</label>
                    <input type="number" id="weightValue" placeholder="0.0" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label>תאריך ושעה:</label>
                    <input type="datetime-local" id="weightDate">
                </div>
                <button onclick="addWeight()">⚖️ שמור משקל</button>
                <div id="weightList"></div>
            </div>

            <!-- Tasks Tab -->
            <div id="tasks" class="tab-content">
                <div class="input-group">
                    <label>משימה חדשה:</label>
                    <input type="text" id="taskName" placeholder="לדוגמה: הולכה 30 דקות">
                </div>
                <button onclick="addTask()" style="margin-bottom: 15px;">✅ הוסף משימה</button>
                <div id="tasksList"></div>
            </div>
        </div>
    </div>

    <script>
        const DATA_KEY = 'health-app-data-v5';
        const TIPS = [
            '🚶 הליכה 30 דקות ביום היא טובה כמו סופרגיבור!',
            '💧 שתה 8 כוסות מים ביום להישאר מחוברת.',
            '🥗 אכול יותר ירקות בכל ארוחה.',
            '😴 שינה 7-8 שעות בלילה חיוני לבריאות.',
            '🏃 אימון 30 דקות ביום משפר את הבריאות.',
            '🧘 מדיטציה 10 דקות ביום מורידה את הלחץ.',
            '🍎 תפוח ביום מעבר לרופא!',
            '🙏 חיוך הוא התרופה הטובה ביותר.'
        ];

        const AI_RESPONSES = {
            'משקל': '⚖️ הורדת משקל בריאה\n\n✓ שתה 8 כוסות מים ביום\n✓ אכול ببטיות קטנות 5-6 פעמים\n✓ תאמן 30 דקות, 5 ימים בשבוע\n✓ נם 7-8 שעות בלילה\n✓ צמצם סוכר\n\n🎯 יעד: 0.5-1 ק״ג בשבוע',
            'בריאות': '💪 תכנית בריאות\n\n1. פעילות: הליכה 30 דקות ביום\n2. תזונה: ירקות, פרות, חלבון\n3. שינה: 7-8 שעות בלילה\n4. מים: 8 כוסות ביום\n5. עקוב אחרי ההתקדמות!',
            'מתכונים': '🍽️ מתכונים בריאים\n\n• סלט ירקות עם לימון\n• עוף בתנור עם ירקות\n• דגים צלויים עם אורז חום\n• ביצים עם שום\n• חומוס עם סלט\n• סלט טונה\n\n💡 הכן ארוחות בראשון!',
            'תרגילים': '🏃 תכנית תרגילים\n\nיום א׳: הליכה 30 דקות\nיום ב׳: יוגה 20 דקות\nיום ג׳: כוח 25 דקות\nיום ד׳: בריכה/ריצה\nיום ה׳: כושר\nשישי-שבת: הרפיה'
        };

        function getData() {
            try {
                const data = localStorage.getItem(DATA_KEY);
                return data ? JSON.parse(data) : getDefaultData();
            } catch (e) {
                console.error('Error reading data:', e);
                return getDefaultData();
            }
        }

        function getDefaultData() {
            return {
                photos: [],
                menu: [],
                weights: [],
                tasks: [],
                aiTips: []
            };
        }

        function saveData(data) {
            try {
                localStorage.setItem(DATA_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('Error saving data:', e);
                alert('שגיאה בשמירת הנתונים');
            }
        }

        function switchTab(event, tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'weight') displayWeight();
            else if (tabName === 'photos') displayPhotos();
            else if (tabName === 'menu') displayMenu();
            else if (tabName === 'tasks') displayTasks();
            else if (tabName === 'tips') displayTips();
        }

        let selectedPhotoFile = null;

        function triggerCameraInput() {
            // יצירת file input חדש כל פעם כדי שיעבוד מחדש
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = function(e) {
                if (e.target.files && e.target.files[0]) {
                    selectedPhotoFile = e.target.files[0];
                    showSuccess('✅ תמונה נבחרה! הוסף הערה והקלק שמור');
                }
            };
            input.click();
        }

        function triggerPhotoInput() {
            // יצירת file input חדש כל פעם כדי שיעבוד מחדש
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                if (e.target.files && e.target.files[0]) {
                    selectedPhotoFile = e.target.files[0];
                    showSuccess('✅ תמונה נבחרה! הוסף הערה והקלק שמור');
                }
            };
            input.click();
        }

        function addPhoto() {
            if (!selectedPhotoFile) {
                showError('⚠️ בחר או צלם תמונה תחילה');
                return;
            }
            processPhoto(selectedPhotoFile);
            selectedPhotoFile = null;
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // הקטן את התמונה לגודל קטן יותר (500x500)
                    const maxWidth = 500;
                    const maxHeight = 500;
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // דחס את התמונה בקוואליטי נמוך (30%) כדי לשמור יותר תמונות
                    const compressedData = canvas.toDataURL('image/jpeg', 0.3);
                    callback(compressedData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processPhoto(file) {
            if (!file.type.startsWith('image/')) {
                alert('בחר קובץ תמונה בבקשה');
                return;
            }

            compressImage(file, function(compressedImage) {
                const data = getData();
                data.photos.push({
                    image: compressedImage,
                    note: document.getElementById('photoNote').value || 'ללא הערה',
                    date: new Date().toLocaleString('he-IL')
                });

                try {
                    saveData(data);
                    document.getElementById('photoNote').value = '';
                    displayPhotos();
                    showSuccess('✅ תמונה נשמרה בהצלחה!');
                } catch (e) {
                    showError('❌ לא מספיק מקום לשמירת תמונות. נסה להסיר כמה תמונות ישנות.');
                    console.error('Error saving photo:', e);
                }
            });
        }

        function displayPhotos() {
            const data = getData();
            const list = document.getElementById('photosList');

            if (data.photos.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📸</div><p>אין תמונות עדיין</p></div>';
                return;
            }

            list.innerHTML = data.photos.map((photo, i) => `
                <div class="photo-item">
                    <img src="${photo.image}" class="photo-image" alt="תמונה">
                    <div class="photo-info">
                        <div class="photo-note">${photo.note}</div>
                        <div class="photo-date">${photo.date}</div>
                        <button class="delete-btn" onclick="deletePhoto(${i});">🗑️ מחק</button>
                    </div>
                </div>
            `).join('');
        }

        function deletePhoto(index) {
            const data = getData();
            data.photos.splice(index, 1);
            saveData(data);
            displayPhotos();
        }

        function addMenuItem() {
            const name = document.getElementById('menuName').value.trim();
            const cal = document.getElementById('menuCal').value;
            const cat = document.getElementById('menuCat').value;

            if (!name || !cal || !cat) {
                showError('⚠️ מלא את כל השדות');
                return;
            }

            const data = getData();
            data.menu.push({
                name: name,
                cal: cal,
                cat: cat,
                date: new Date().toLocaleString('he-IL')
            });
            saveData(data);
            document.getElementById('menuName').value = '';
            document.getElementById('menuCal').value = '';
            document.getElementById('menuCat').value = '';
            displayMenu();
            showSuccess('✅ מנה נוספה בהצלחה!');
        }

        function displayMenu() {
            const data = getData();
            const list = document.getElementById('menuList');

            if (data.menu.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🍽️</div><p>אין פריטים בתפריט</p></div>';
                return;
            }

            list.innerHTML = data.menu.map((item, i) => `
                <div class="item">
                    <div class="item-header">
                        <span class="item-title">${item.name}</span>
                        <span class="item-date">${item.cat}</span>
                    </div>
                    <div class="item-detail">📊 ${item.cal} קלוריות</div>
                    <button class="delete-btn" onclick="deleteMenuItem(${i});">🗑️ מחק</button>
                </div>
            `).join('');
        }

        function deleteMenuItem(index) {
            const data = getData();
            data.menu.splice(index, 1);
            saveData(data);
            displayMenu();
        }

        function generateTip() {
            const data = getData();
            const randomTip = TIPS[Math.floor(Math.random() * TIPS.length)];
            data.aiTips.push({
                tip: randomTip,
                date: new Date().toLocaleString('he-IL')
            });
            saveData(data);
            displayTips();
        }

        function displayTips() {
            const data = getData();
            const list = document.getElementById('tipsList');

            if (data.aiTips.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💡</div><p>לחץ על הכפתור לקבל טיפ</p></div>';
                return;
            }

            list.innerHTML = data.aiTips.map((tip, i) => `
                <div class="item">
                    <div class="item-detail">${tip.tip}</div>
                    <div class="item-date">${tip.date}</div>
                    <button class="delete-btn" onclick="deleteTip(${i});">🗑️ מחק</button>
                </div>
            `).join('');
        }

        function deleteTip(index) {
            const data = getData();
            data.aiTips.splice(index, 1);
            saveData(data);
            displayTips();
        }

        function addWeight() {
            const value = document.getElementById('weightValue').value;
            const date = document.getElementById('weightDate').value;

            if (!value) {
                showError('⚠️ הכנס משקל');
                return;
            }

            const data = getData();
            const dateObj = date ? new Date(date) : new Date();
            data.weights.push({
                val: parseFloat(value),
                time: dateObj.toLocaleString('he-IL')
            });
            saveData(data);
            document.getElementById('weightValue').value = '';
            document.getElementById('weightDate').value = '';
            displayWeight();
            showSuccess('✅ משקל נשמר בהצלחה!');
        }

        function displayWeight() {
            const data = getData();
            const list = document.getElementById('weightList');
            const statsDiv = document.getElementById('weightStats');

            if (data.weights.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚖️</div><p>אין נתוני משקל עדיין</p></div>';
                statsDiv.innerHTML = '';
                return;
            }

            const weights = data.weights.map(w => parseFloat(w.val));
            const latest = weights[weights.length - 1];
            const avg = (weights.reduce((a, b) => a + b) / weights.length).toFixed(1);

            statsDiv.innerHTML = `
                <div class="stat-box">
                    <div class="stat-value">${latest}</div>
                    <div class="stat-label">משקל אחרון</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${avg}</div>
                    <div class="stat-label">ממוצע</div>
                </div>
            `;

            list.innerHTML = data.weights.map((weight, i) => `
                <div class="item">
                    <div class="item-header">
                        <span class="item-title">⚖️ ${weight.val} ק"ג</span>
                        <span class="item-date">${weight.time}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteWeight(${i});">🗑️ מחק</button>
                </div>
            `).reverse().join('');
        }

        function deleteWeight(index) {
            const data = getData();
            data.weights.splice(index, 1);
            saveData(data);
            displayWeight();
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();

            if (!name) {
                showError('⚠️ הכנס שם משימה');
                return;
            }

            const data = getData();
            data.tasks.push({
                name: name,
                completed: false,
                date: new Date().toLocaleString('he-IL')
            });
            saveData(data);
            document.getElementById('taskName').value = '';
            displayTasks();
            showSuccess('✅ משימה נוספה בהצלחה!');
        }

        function displayTasks() {
            const data = getData();
            const list = document.getElementById('tasksList');

            if (data.tasks.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><p>אין משימות עדיין</p></div>';
                return;
            }

            list.innerHTML = data.tasks.map((task, i) => `
                <div class="item ${task.completed ? 'completed' : ''}">
                    <div class="item-header">
                        <div class="checkbox-container">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${i})">
                            <span class="item-title">${task.name}</span>
                        </div>
                    </div>
                    <div class="item-date">${task.date}</div>
                    <button class="delete-btn" onclick="deleteTask(${i});">🗑️ מחק</button>
                </div>
            `).join('');
        }

        function toggleTask(index) {
            const data = getData();
            data.tasks[index].completed = !data.tasks[index].completed;
            saveData(data);
            displayTasks();
        }

        function deleteTask(index) {
            const data = getData();
            data.tasks.splice(index, 1);
            saveData(data);
            displayTasks();
        }

        function openAI(question) {
            if (!question || question.trim() === '') {
                showError('⚠️ בבקשה שאל שאלה');
                return;
            }

            const responseDiv = document.getElementById('aiResponse');
            responseDiv.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">⏳ אני חושב על התשובה...</div>';

            let response = null;
            const questionLower = question.toLowerCase();

            for (let [keyword, answer] of Object.entries(AI_RESPONSES)) {
                if (questionLower.includes(keyword)) {
                    response = answer;
                    break;
                }
            }

            if (!response) {
                response = '👋 שלום! אני יכול לעזור לך עם:\n\n• משקל\n• בריאות\n• מתכונים\n• תרגילים\n\nנסה לשאול על אחד מהנושאים!';
            }

            setTimeout(() => {
                responseDiv.innerHTML = `<div class="ai-response-box">${response}</div>`;
                document.getElementById('aiQuestion').value = '';
            }, 600);
        }

        function showSuccess(msg) {
            const content = document.querySelector('.content');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'success-msg';
            msgDiv.textContent = msg;
            content.insertBefore(msgDiv, content.firstChild);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        function showError(msg) {
            const content = document.querySelector('.content');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'error-msg';
            msgDiv.textContent = msg;
            content.insertBefore(msgDiv, content.firstChild);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displayPhotos();
            displayMenu();
            displayTips();
            displayWeight();
            displayTasks();

            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('weightDate').value = now.toISOString().slice(0, 16);
        });
    </script>
</body>
</html>
